<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>云端枕边书 Cloud Lullaby</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  html, body, #root { height: 100%; margin: 0; padding: 0; overscroll-behavior: none; }
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #0a0a0a; -webkit-tap-highlight-color: transparent; }
  .paper-texture { background-color: #fffdf7; background-image: radial-gradient(rgba(180,140,90,0.08) 1px, transparent 1px), radial-gradient(rgba(180,140,90,0.05) 1px, transparent 1px); background-size: 20px 20px, 13px 13px; background-position: 0 0, 6px 6px; }
  .child-bg { background: linear-gradient(135deg, #d4f4dd 0%, #fef6c7 40%, #fcd5ce 75%, #e2d5f7 100%); background-size: 200% 200%; animation: gradientShift 18s ease infinite; }
  @keyframes gradientShift { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }
  .brush-tool { transition: transform .25s cubic-bezier(.34,1.56,.64,1), box-shadow .25s ease; transform-origin: bottom center; }
  .brush-tool.active { transform: translateY(-18px) scale(1.18); }
  .brush-tool:active { transform: translateY(-6px) scale(0.95); }
  .magic-btn { background: linear-gradient(135deg, #ff9a8b 0%, #ff6a88 50%, #ff99ac 100%); box-shadow: 0 10px 30px rgba(255,106,136,0.45), inset 0 -4px 8px rgba(0,0,0,0.08); }
  .magic-btn-active { background: linear-gradient(135deg, #ff69b4 0%, #ff1493 50%, #ff69b4 100%); box-shadow: 0 0 50px rgba(255, 20, 147, 0.6), 0 8px 24px rgba(255, 20, 147, 0.4); animation: magicPulse 1.4s ease-in-out infinite; }
  @keyframes magicPulse { 0%,100%{transform:scale(1);box-shadow:0 0 50px rgba(255,20,147,0.6), 0 8px 24px rgba(255,20,147,0.4)} 50%{transform:scale(1.1);box-shadow:0 0 90px rgba(255,20,147,0.9), 0 12px 40px rgba(255,20,147,0.6)} }
  .sparkle { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: white; animation: sparkle 2s linear infinite; pointer-events: none; }
  @keyframes sparkle { 0%,100%{opacity:0;transform:scale(0)} 50%{opacity:1;transform:scale(1.2)} }
  .owl-float { animation: floatOwl 3s ease-in-out infinite; }
  @keyframes floatOwl { 0%,100%{transform:translateY(0) rotate(-2deg)} 50%{transform:translateY(-12px) rotate(2deg)} }
  .owl-bubble-float { animation: bubbleFloat 3s ease-in-out infinite; animation-delay: 0.5s; }
  @keyframes bubbleFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
  .owl-zzz { animation: zzz 2.5s ease-in-out infinite; }
  @keyframes zzz { 0%{opacity:0;transform:translate(0,0) scale(0.6)} 50%{opacity:1} 100%{opacity:0;transform:translate(20px,-20px) scale(1.2)} }

  /* 魔法水晶球麦克风 */
  .crystal-ball {
    background:
      radial-gradient(circle at 35% 35%, rgba(255, 255, 255, 0.95) 0%, rgba(200, 220, 255, 0.5) 15%, transparent 45%),
      radial-gradient(circle at 50% 50%, rgba(167, 139, 250, 0.85) 0%, rgba(139, 92, 246, 0.9) 35%, rgba(91, 33, 182, 1) 100%);
    box-shadow:
      inset 0 -12px 40px rgba(0, 0, 0, 0.35),
      inset 0 12px 40px rgba(255, 255, 255, 0.45),
      0 0 50px rgba(167, 139, 250, 0.7),
      0 0 100px rgba(139, 92, 246, 0.35);
    border: 3px solid rgba(255, 255, 255, 0.35);
    animation: crystalBreathing 4s ease-in-out infinite;
  }
  @keyframes crystalBreathing { 0%,100%{transform:scale(1);box-shadow:inset 0 -12px 40px rgba(0,0,0,0.35), inset 0 12px 40px rgba(255,255,255,0.45), 0 0 50px rgba(167,139,250,0.7), 0 0 100px rgba(139,92,246,0.35)} 50%{transform:scale(1.04);box-shadow:inset 0 -12px 40px rgba(0,0,0,0.35), inset 0 12px 40px rgba(255,255,255,0.55), 0 0 70px rgba(167,139,250,0.85), 0 0 120px rgba(139,92,246,0.5)} }
  .crystal-ball-recording {
    background:
      radial-gradient(circle at 35% 35%, rgba(255, 255, 255, 0.95) 0%, rgba(255, 200, 220, 0.6) 15%, transparent 45%),
      radial-gradient(circle at 50% 50%, rgba(255, 100, 130, 0.9) 0%, rgba(239, 68, 100, 0.95) 35%, rgba(180, 20, 60, 1) 100%);
    box-shadow:
      inset 0 -12px 40px rgba(0, 0, 0, 0.4),
      inset 0 12px 40px rgba(255, 255, 255, 0.55),
      0 0 60px rgba(239, 68, 100, 0.8),
      0 0 120px rgba(239, 68, 100, 0.45);
    animation: none;
    transform: scale(1.05);
  }
  .sound-wave-ring { position: absolute; inset: -8px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, 0.4); animation: soundWaveExpand 2s ease-out infinite; pointer-events: none; }
  .sound-wave-ring:nth-child(2) { animation-delay: 0.4s; }
  .sound-wave-ring:nth-child(3) { animation-delay: 0.8s; }
  .sound-wave-ring:nth-child(4) { animation-delay: 1.2s; }
  @keyframes soundWaveExpand { 0%{transform:scale(1);opacity:0.7} 100%{transform:scale(2.6);opacity:0} }

  /* 信封飞 */
  .envelope-fly { animation: envelopeFly 1.8s cubic-bezier(.5,0,.3,1) forwards; filter: drop-shadow(0 12px 30px rgba(0,0,0,0.25)); }
  @keyframes envelopeFly { 0%{transform:translateY(60px) scale(0.5) rotate(-8deg);opacity:0} 18%{transform:translateY(0) scale(1.05) rotate(0);opacity:1} 35%{transform:translateY(-20px) scale(1) rotate(-4deg);opacity:1} 65%{transform:translateY(-180px) scale(1.1) rotate(8deg);opacity:1} 100%{transform:translateY(-130vh) scale(1.4) rotate(20deg);opacity:0} }
  .trail-star { position: absolute; font-size: 18px; animation: trailStar 1.4s ease-out forwards; pointer-events: none; }
  @keyframes trailStar { 0%{opacity:1;transform:translateY(0) scale(.6)} 100%{opacity:0;transform:translateY(40px) scale(.2)} }

  /* 打字机 */
  .typer-cursor { display:inline-block; width:2px; height:1em; background:currentColor; margin-left:2px; vertical-align:text-bottom; animation: blink .9s steps(1) infinite; }
  @keyframes blink { 50%{opacity:0} }

  /* 手机模型 */
  .mobile-mockup { width:390px; height:800px; border-radius:50px; background:#1a1a1a; padding:14px; box-shadow: 0 30px 80px rgba(0,0,0,0.4), 0 0 0 2px #2a2a2a; position:relative; }
  .mobile-mockup::before { content:''; position:absolute; top:22px; left:50%; transform:translateX(-50%); width:110px; height:28px; background:#000; border-radius:20px; z-index:30; }
  .mobile-screen { width:100%; height:100%; border-radius:38px; overflow:hidden; background:#f5f5f7; position:relative; }

  canvas { touch-action: none; display: block; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  .console-btn { transition: all .2s ease; border: 1px solid rgba(255,255,255,0.15); }
  .console-btn:hover { background: rgba(255,255,255,0.08); }
  .console-btn.active { background: rgba(255,255,255,0.95); color:#000; border-color:white; }
  .yawn-bubble { animation: yawnBob 3.2s ease-in-out infinite; }
  @keyframes yawnBob { 0%,100%{transform:scale(1) translateY(0);opacity:.6} 50%{transform:scale(1.15) translateY(-3px);opacity:1} }
  .thumb-card { transition: transform .4s ease; }
  .thumb-card:hover { transform: rotate(-3deg) scale(1.04); }

  /* 情绪雷达 */
  .radar-bg { position: relative; overflow: hidden; }
  .radar-bg::after { content:''; position:absolute; top:50%; left:50%; width:200px; height:200px; transform:translate(-50%,-50%); background: radial-gradient(circle, rgba(239,68,68,0.06) 0%, transparent 70%); border-radius:50%; animation: radarPulse 3s ease-in-out infinite; pointer-events:none; }
  @keyframes radarPulse { 0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.5} 50%{transform:translate(-50%,-50%) scale(1.3);opacity:.2} }

  /* loading */
  .loading-spin { border: 4px solid #e5e7eb; border-top-color: #ff6a88; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 书本 */
  .book-page { background: linear-gradient(135deg, #fff8e7 0%, #ffe0b2 100%); }

  /* 绘本阅读器 */
  .page-content { animation: pageContentIn .4s ease; }
  @keyframes pageContentIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

  /* ========== Landing Page ========== */
  .landing-bg { position: relative; width: 100%; height: 100%; overflow: hidden; }

  /* 深邃动态银河背景 */
  .cosmos-bg {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 15% 85%, rgba(30, 27, 75, 0.9) 0%, transparent 55%),
      radial-gradient(ellipse at 85% 15%, rgba(49, 46, 129, 0.8) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 50%, rgba(8, 8, 25, 0.95) 0%, transparent 70%),
      linear-gradient(160deg, #010108 0%, #060618 25%, #0f0a20 50%, #0a0a1a 75%, #02020a 100%);
    background-size: 200% 200%, 200% 200%, 200% 200%, 300% 300%;
    animation: cosmosFlow 25s ease infinite;
    z-index: 0;
  }
  @keyframes cosmosFlow {
    0%,100%{background-position:0% 50%, 100% 50%, 50% 100%, 0% 50%}
    33%{background-position:100% 50%, 0% 100%, 100% 0%, 50% 100%}
    66%{background-position:50% 100%, 100% 0%, 0% 50%, 100% 50%}
  }

  /* 鼠标跟随发光特效已彻底移除（曾因 setState/mousemove 导致背景疯狂闪烁） */


  /* 流星 */
  .shooting-star {
    position: absolute;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: white;
    box-shadow: 0 0 10px 2px rgba(255,255,255,0.8), 0 0 30px 6px rgba(167,139,250,0.3);
    opacity: 0;
    pointer-events: none;
    z-index: 3;
  }
  .shooting-star::after {
    content: '';
    position: absolute;
    top: 50%;
    right: 0;
    width: 200px;
    height: 2px;
    background: linear-gradient(90deg, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0.4) 50%, transparent 100%);
    transform: translateY(-50%);
    border-radius: 0 50% 50% 0;
  }
  .shooting-star-1 { top: 10%; left: 70%; animation: shoot1 8s linear infinite; animation-delay: 1s; }
  .shooting-star-2 { top: 5%; left: 50%; animation: shoot2 10s linear infinite; animation-delay: 4s; }
  .shooting-star-3 { top: 15%; left: 85%; animation: shoot3 9s linear infinite; animation-delay: 7s; }
  @keyframes shoot1 {
    0% { transform: rotate(-45deg) translateX(0); opacity: 0; }
    5% { opacity: 1; }
    25% { transform: rotate(-45deg) translateX(-400px); opacity: 0; }
    100% { opacity: 0; }
  }
  @keyframes shoot2 {
    0% { transform: rotate(-40deg) translateX(0); opacity: 0; }
    5% { opacity: 1; }
    20% { transform: rotate(-40deg) translateX(-350px); opacity: 0; }
    100% { opacity: 0; }
  }
  @keyframes shoot3 {
    0% { transform: rotate(-50deg) translateX(0); opacity: 0; }
    5% { opacity: 1; }
    22% { transform: rotate(-50deg) translateX(-380px); opacity: 0; }
    100% { opacity: 0; }
  }

  /* 原有star和cloud保留 */
  .star { position: absolute; background: white; border-radius: 50%; opacity: 0; animation: starTwinkle var(--duration) ease-in-out infinite; animation-delay: var(--delay); pointer-events: none; }
  @keyframes starTwinkle { 0%,100%{opacity:0;transform:scale(0.5)} 50%{opacity:var(--peak-opacity,0.8);transform:scale(1)} }
  .cloud { position: absolute; background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.22), rgba(255,255,255,0.04)); border-radius: 50%; filter: blur(18px); animation: cloudFloat var(--duration) ease-in-out infinite alternate; pointer-events: none; }
  @keyframes cloudFloat { from{transform:translateX(0) translateY(0)} to{transform:translateX(var(--tx,30px)) translateY(var(--ty,-20px))} }

  /* 新增多层繁星 */
  .cosmos-star {
    position: absolute;
    background: white;
    border-radius: 50%;
    pointer-events: none;
    z-index: 1;
  }
  .cosmos-star.big { animation: twinkleBig var(--duration) ease-in-out infinite; animation-delay: var(--delay); }
  .cosmos-star.med { animation: twinkleMed var(--duration) ease-in-out infinite; animation-delay: var(--delay); }
  .cosmos-star.small { animation: twinkleSmall var(--duration) ease-in-out infinite; animation-delay: var(--delay); }
  @keyframes twinkleBig { 0%,100%{opacity:0.2;transform:scale(0.8)} 50%{opacity:1;transform:scale(1.3)} }
  @keyframes twinkleMed { 0%,100%{opacity:0.1;transform:scale(0.6)} 50%{opacity:0.9;transform:scale(1.1)} }
  @keyframes twinkleSmall { 0%,100%{opacity:0.05;transform:scale(0.5)} 50%{opacity:0.7;transform:scale(1)} }

  /* 魔法童话书 - 增强3D */
  .magic-book-wrapper { perspective: 1600px; }
  .magic-book {
    position: relative;
    width: 820px;
    height: 540px;
    transform-style: preserve-3d;
    transform: rotateX(10deg);
  }
  @media (max-width: 900px) {
    .magic-book { transform: rotateX(10deg) scale(0.68); }
  }
  @media (max-width: 640px) {
    .magic-book { transform: rotateX(10deg) scale(0.48); }
  }

  /* 书皮 */
  .book-cover {
    position: absolute;
    inset: -18px;
    background:
      linear-gradient(145deg, #181540 0%, #2a2270 30%, #452888 50%, #2a2270 70%, #181540 100%);
    border-radius: 28px;
    box-shadow:
      0 0 60px rgba(139, 92, 246, 0.4),
      0 0 120px rgba(139, 92, 246, 0.15),
      0 40px 90px rgba(0,0,0,0.7),
      inset 0 1px 4px rgba(255,255,255,0.25),
      inset 0 -4px 10px rgba(0,0,0,0.6);
  }
  .book-cover::before {
    content: '';
    position: absolute;
    inset: 5px;
    border-radius: 23px;
    border: 1px solid rgba(251, 191, 36, 0.12);
    pointer-events: none;
  }

  /* 书页 */
  .book-page-left, .book-page-right {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 50%;
    background-color: #fffdf7;
    overflow: hidden;
  }
  .book-page-left {
    left: 0;
    border-radius: 10px 4px 4px 10px;
    background-image:
      repeating-linear-gradient(180deg, transparent, transparent 22px, rgba(160,130,80,0.04) 22px, rgba(160,130,80,0.04) 23px);
    box-shadow:
      inset -12px 0 24px rgba(0,0,0,0.04),
      inset -4px 0 8px rgba(255,255,255,0.9),
      5px 5px 0 #e8e8e8,
      10px 10px 0 #d8d8d8,
      15px 15px 0 #c8c8c8,
      20px 20px 0 #b8b8b8,
      25px 25px 0 #a8a8a8,
      30px 30px 40px rgba(0,0,0,0.2);
  }
  .book-page-right {
    right: 0;
    border-radius: 4px 10px 10px 4px;
    background-image:
      repeating-linear-gradient(180deg, transparent, transparent 22px, rgba(160,130,80,0.04) 22px, rgba(160,130,80,0.04) 23px);
    box-shadow:
      inset 12px 0 24px rgba(0,0,0,0.04),
      inset 4px 0 8px rgba(255,255,255,0.9),
      -5px 5px 0 #e8e8e8,
      -10px 10px 0 #d8d8d8,
      -15px 15px 0 #c8c8c8,
      -20px 20px 0 #b8b8b8,
      -25px 25px 0 #a8a8a8,
      -30px 30px 40px rgba(0,0,0,0.2);
  }

  /* 书脊折痕 */
  .book-spine-crease {
    position: absolute;
    left: 50%;
    top: -3px;
    bottom: -3px;
    width: 40px;
    transform: translateX(-50%);
    background: linear-gradient(90deg, transparent 0%, rgba(0,0,0,0.06) 10%, rgba(0,0,0,0.22) 50%, rgba(0,0,0,0.06) 90%, transparent 100%);
    pointer-events: none;
  }

  /* 页面边缘高光 */
  .book-page-left::before, .book-page-right::before {
    content: '';
    position: absolute;
    top: 0;
    bottom: 0;
    width: 18px;
    pointer-events: none;
    z-index: 2;
  }
  .book-page-left::before {
    left: 0;
    background: linear-gradient(90deg, rgba(255,255,255,0.5) 0%, transparent 100%);
  }
  .book-page-right::before {
    right: 0;
    background: linear-gradient(-90deg, rgba(255,255,255,0.5) 0%, transparent 100%);
  }

  /* 手绘涂鸦风格 */
  .kid-font {
    font-family: 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', '华文行楷', 'STXingkai', 'cursive', sans-serif;
  }
  .doodle-text {
    font-family: 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', '华文行楷', 'STXingkai', 'cursive', sans-serif;
    color: #4a3f35;
  }
  .doodle-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 220px;
    padding: 14px 0;
    font-family: 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', '华文行楷', 'STXingkai', 'cursive', sans-serif;
    font-size: 20px;
    font-weight: bold;
    color: #5a4a3a;
    background:
      radial-gradient(circle at 25% 25%, rgba(255,220,180,0.5) 0%, transparent 60%),
      radial-gradient(circle at 75% 75%, rgba(255,200,200,0.4) 0%, transparent 60%),
      #fff8f0;
    border: 3px dashed #c4a882;
    border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 4px 4px 0 rgba(196,168,130,0.25);
    transform: rotate(-1deg);
  }
  .doodle-btn:nth-child(2) {
    transform: rotate(1.5deg);
    background:
      radial-gradient(circle at 30% 70%, rgba(200,220,255,0.5) 0%, transparent 60%),
      radial-gradient(circle at 70% 30%, rgba(220,255,200,0.4) 0%, transparent 60%),
      #f0f8ff;
    border-color: #8fa8c8;
    box-shadow: 4px 4px 0 rgba(143,168,200,0.25);
  }
  .doodle-btn:hover {
    transform: rotate(0deg) scale(1.08);
    border-style: solid;
    border-width: 4px;
    box-shadow: 6px 6px 0 rgba(196,168,130,0.35);
  }
  .doodle-btn:nth-child(2):hover {
    box-shadow: 6px 6px 0 rgba(143,168,200,0.35);
  }
  .doodle-btn:active {
    transform: rotate(0deg) scale(0.95);
  }
  .doodle-wiggle:hover {
    animation: wiggle 0.4s ease-in-out;
  }
  @keyframes wiggle {
    0%,100%{transform:rotate(0deg) scale(1.08)}
    25%{transform:rotate(-3deg) scale(1.08)}
    75%{transform:rotate(3deg) scale(1.08)}
  }

  /* ========== Dreamy Child UI ========== */
  .child-dream-bg {
    background:
      radial-gradient(ellipse at 20% 30%, rgba(255, 200, 230, 0.55) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 20%, rgba(180, 220, 255, 0.55) 0%, transparent 50%),
      radial-gradient(ellipse at 60% 80%, rgba(220, 180, 255, 0.5) 0%, transparent 50%),
      radial-gradient(ellipse at 15% 75%, rgba(180, 255, 240, 0.45) 0%, transparent 50%),
      linear-gradient(160deg, #f0e6ff 0%, #d4e5ff 25%, #e0f7fa 50%, #ffe6f0 75%, #e8d5f7 100%);
    background-size: 200% 200%, 200% 200%, 200% 200%, 200% 200%, 300% 300%;
    animation: auroraFlow 20s ease infinite;
  }
  @keyframes auroraFlow {
    0%,100%{background-position:0% 50%, 100% 50%, 50% 100%, 0% 100%, 0% 50%}
    50%{background-position:100% 50%, 0% 100%, 100% 0%, 100% 0%, 100% 50%}
  }
  .child-dream-bg::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(2px 2px at 40px 60px, rgba(255,255,255,0.9), transparent),
      radial-gradient(2px 2px at 90px 150px, rgba(255,255,255,0.7), transparent),
      radial-gradient(1.5px 1.5px at 180px 40px, rgba(255,255,255,0.8), transparent),
      radial-gradient(2px 2px at 250px 120px, rgba(255,255,255,0.6), transparent),
      radial-gradient(1.5px 1.5px at 320px 80px, rgba(255,255,255,0.9), transparent),
      radial-gradient(2px 2px at 400px 180px, rgba(255,255,255,0.7), transparent),
      radial-gradient(1.5px 1.5px at 500px 50px, rgba(255,255,255,0.8), transparent),
      radial-gradient(2px 2px at 580px 160px, rgba(255,255,255,0.6), transparent),
      radial-gradient(1.5px 1.5px at 650px 90px, rgba(255,255,255,0.9), transparent),
      radial-gradient(2px 2px at 720px 200px, rgba(255,255,255,0.7), transparent),
      radial-gradient(1.5px 1.5px at 800px 70px, rgba(255,255,255,0.8), transparent),
      radial-gradient(2px 2px at 880px 140px, rgba(255,255,255,0.6), transparent),
      radial-gradient(1.5px 1.5px at 950px 30px, rgba(255,255,255,0.9), transparent),
      radial-gradient(2px 2px at 1050px 170px, rgba(255,255,255,0.7), transparent),
      radial-gradient(1.5px 1.5px at 1120px 100px, rgba(255,255,255,0.8), transparent),
      radial-gradient(2px 2px at 1200px 190px, rgba(255,255,255,0.6), transparent);
    background-size: 600px 300px;
    animation: starfieldDrift 80s linear infinite;
    pointer-events: none;
    z-index: 0;
  }
  @keyframes starfieldDrift { from{background-position:0 0} to{background-position:600px 300px} }

        const cat = taxonomy[catKey];
        if (cat && cat[key]) {
          extracted.push({ key, ...cat[key], category: catKey.split('_')[0] });
          break;
        }
      }
    });
  }
  if (extracted.length === 0) {
    const allFeatures = [];
    for (const catKey of Object.keys(taxonomy)) {
      if (catKey === 'description') continue;
      const cat = taxonomy[catKey];
      for (const k of Object.keys(cat)) {
        allFeatures.push({ key: k, ...cat[k], category: catKey.split('_')[0] });
      }
    }
    extracted.push(allFeatures[Math.floor(Math.random() * allFeatures.length)]);
    extracted.push(allFeatures[Math.floor(Math.random() * allFeatures.length)]);
  }

  return {
    rule,
    extractedFeatures: extracted.slice(0, 3),
    emotions: rule.psychological_diagnosis.implicit_emotion,
    interpretation: rule.psychological_diagnosis.clinical_interpretation,
    directive: rule['parental_intervention_家长关注干预'].intervention_directive,
    urgency: rule['parental_intervention_家长关注干预'].urgency_level,
    requiresAttention: rule['parental_intervention_家长关注干预'].requires_attention,
    storyTone: rule['story_foundation_故事基调奠定'],
  };
}

    })),

async function analyzeDoodleWithAI(transcript = '') {
  const fallback = () => simulateAnalysis(transcript);
  const apiKey = localStorage.getItem('DEEPSEEK_API_KEY');
  if (!apiKey) {
    console.log('未配置 DeepSeek API Key，使用本地模拟逻辑');
    return { ...fallback(), aiGenerated: false };
  }
  try {
    const { system, user } = buildDeepSeekPrompt(transcript);
    const response = await fetch('https://api.deepseek.com/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${apiKey}`
      },
      body: JSON.stringify({
        model: 'deepseek-chat',
        messages: [
          { role: 'system', content: system },
          { role: 'user', content: user }
        ],
        temperature: 0.4,
        max_tokens: 1200,
        response_format: { type: 'json_object' }
      })
    });

    if (!response.ok) {
      const errText = await response.text().catch(() => 'unknown');
      throw new Error(`DeepSeek HTTP ${response.status}: ${errText}`);
    }

    const data = await response.json();
    const content = data.choices?.[0]?.message?.content;
    if (!content) throw new Error('DeepSeek returned empty content');

    const result = JSON.parse(content);
    const mappings = MOOD_DICTIONARY['emotion_and_tone_mapping_情绪基调与干预映射'];
    const matchedRule = mappings.find(r => r.rule_id === result.rule_id) || mappings[0];

    return {
      rule: matchedRule,
      extractedFeatures: (result.matched_features || []).map(f => ({
        key: f.id,
        name: f.name,
        category: f.category,
        description: f.reason || ''
      })),
      emotions: result.emotions || matchedRule.psychological_diagnosis.implicit_emotion,
      interpretation: result.clinical_interpretation || matchedRule.psychological_diagnosis.clinical_interpretation,
      directive: result.directive || matchedRule['parental_intervention_家长关注干预'].intervention_directive,
      urgency: result.urgency || matchedRule['parental_intervention_家长关注干预'].urgency_level,
      requiresAttention: !!(result.urgency || '').match(/High|Highest|Critical|Level [3-5]/i),
      storyTone: result.story_tone || matchedRule['story_foundation_故事基调奠定'],
      aiGenerated: true,
      raw: result
    };
  } catch (err) {
    console.warn('DeepSeek API 调用失败，回退到本地模拟逻辑：', err);
    const local = fallback();
    return { ...local, aiGenerated: false, error: err.message };
  }
}

function urgencyBadgeClass(level) {
  if (level.includes('Critical') || level.includes('Level 5')) return 'bg-red-600 text-white';
  if (level.includes('Highest') || level.includes('Level 4')) return 'bg-orange-500 text-white';
  if (level.includes('High') || level.includes('Level 3')) return 'bg-amber-500 text-white';
  if (level.includes('Moderate') || level.includes('Level 2')) return 'bg-yellow-400 text-stone-800';
  return 'bg-emerald-100 text-emerald-700';
}

function detectEndingType(parentText) {
  if (!parentText) return 'default';
  const p = parentText.toLowerCase();
  if (p.includes('魔法') || p.includes('魔杖') || p.includes('魔法棒') || p.includes('道具') || p.includes('宝剑') || p.includes('神器') || p.includes(' wand') || p.includes('magic')) return 'magic';
  if (p.includes('勇敢') || p.includes('勇气') || p.includes('坚强') || p.includes('胆大') || p.includes(' brave') || p.includes('courage')) return 'bravery';
  if (p.includes('电话') || p.includes('视频') || p.includes('联系') || p.includes('通话') || p.includes('声音') || p.includes('call') || p.includes('phone')) return 'connection';
  if (p.includes('梦') || p.includes('梦境') || p.includes('枕头') || p.includes('睡觉') || p.includes(' dream') || p.includes('sleep')) return 'dream';
  if (p.includes('爱') || p.includes('拥抱') || p.includes('抱抱') || p.includes('温暖') || p.includes('陪伴') || p.includes(' love') || p.includes('hug')) return 'love';
  return 'default';
}

/* ============== 产品引导页 ============== */
function LandingPage({ onEnterChild, onEnterParent }) {
  // 静态随机星空：useMemo 锁定位置，组件首次渲染时生成一次，之后永不重算。
  // 不使用 setState 跟随鼠标，避免重渲染导致星星位置整体重置造成的"疯狂闪烁"。
  const stars = useMemo(() => Array.from({ length: 50 }, (_, i) => ({
    id: i,
    top: `${Math.random() * 100}%`,
    left: `${Math.random() * 100}%`,
    size: Math.random() * 3 + 1,
    duration: `${Math.random() * 3 + 2}s`,
    delay: `${Math.random() * 3}s`,
    peak: Math.random() * 0.5 + 0.3,
  })), []);
  const clouds = useMemo(() => Array.from({ length: 8 }, (_, i) => ({
    id: i,
    top: `${Math.random() * 80 + 10}%`,
    left: `${Math.random() * 80 + 10}%`,
    width: Math.random() * 120 + 80,
    height: Math.random() * 60 + 40,
    duration: `${Math.random() * 6 + 6}s`,
    tx: `${(Math.random() - 0.5) * 60}px`,
    ty: `${(Math.random() - 0.5) * 40}px`,
  })), []);

  const bigStars = useMemo(() => Array.from({ length: 25 }, (_, i) => ({
    id: `b${i}`,
    top: `${Math.random() * 100}%`,
    left: `${Math.random() * 100}%`,
    size: Math.random() * 2.5 + 2,
    duration: `${Math.random() * 2 + 3}s`,
    delay: `${Math.random() * 4}s`,
  })), []);
  const medStars = useMemo(() => Array.from({ length: 50 }, (_, i) => ({
    id: `m${i}`,
    top: `${Math.random() * 100}%`,
    left: `${Math.random() * 100}%`,
    size: Math.random() * 1.5 + 1,
    duration: `${Math.random() * 2 + 2}s`,
    delay: `${Math.random() * 4}s`,
  })), []);
  const smallStars = useMemo(() => Array.from({ length: 80 }, (_, i) => ({
    id: `s${i}`,
    top: `${Math.random() * 100}%`,
    left: `${Math.random() * 100}%`,
    size: Math.random() * 1 + 0.5,
    duration: `${Math.random() * 2 + 1.5}s`,
    delay: `${Math.random() * 4}s`,
  })), []);

  return (
    <div
      className="landing-bg relative flex items-center justify-center"
    >
      {/* 深邃动态银河背景 */}
      <div className="cosmos-bg" />

      {/* 多层繁星 */}
      {bigStars.map(s => (
        <div key={s.id} className="cosmos-star big" style={{ top: s.top, left: s.left, width: s.size, height: s.size, '--duration': s.duration, '--delay': s.delay }} />
      ))}
      {medStars.map(s => (
        <div key={s.id} className="cosmos-star med" style={{ top: s.top, left: s.left, width: s.size, height: s.size, '--duration': s.duration, '--delay': s.delay }} />
      ))}
      {smallStars.map(s => (
        <div key={s.id} className="cosmos-star small" style={{ top: s.top, left: s.left, width: s.size, height: s.size, '--duration': s.duration, '--delay': s.delay }} />
      ))}

      {/* 流星 */}
      <div className="shooting-star shooting-star-1" />
      <div className="shooting-star shooting-star-2" />
      <div className="shooting-star shooting-star-3" />

      {/* 原有魔法粒子（保留，z-index使其从书中飘出） */}
      {stars.map(s => (
        <div key={s.id} className="star" style={{ top: s.top, left: s.left, width: s.size, height: s.size, '--duration': s.duration, '--delay': s.delay, '--peak-opacity': s.peak, zIndex: 15 }} />
      ))}
      {clouds.map(c => (
        <div key={c.id} className="cloud" style={{ top: c.top, left: c.left, width: c.width, height: c.height, '--duration': c.duration, '--tx': c.tx, '--ty': c.ty, zIndex: 15 }} />
      ))}

      {/* 3D 魔法童话书 */}
      <div className="magic-book-wrapper relative flex items-center justify-center px-4" style={{ zIndex: 20 }}>
        <div className="magic-book">
          {/* 高级皮革书皮 */}
          <div className="book-cover" />

          {/* 左页：标题与介绍（手绘涂鸦风） */}
          <div className="book-page-left flex flex-col items-center justify-center px-10 py-12 text-center select-none">
            <div className="text-5xl mb-4" style={{ filter: 'drop-shadow(0 3px 6px rgba(0,0,0,0.15))' }}>☁️📖</div>
            <h1 className="kid-font text-[32px] font-bold text-stone-800 mb-2 tracking-wide">云端枕边书</h1>
            <div className="doodle-text text-xs text-stone-500 font-medium tracking-[0.2em] mb-6">CLOUD LULLABY</div>
            <p className="doodle-text text-sm leading-7 max-w-[240px] text-stone-600">
              跨越千里的 AI 亲子共创绘本<br/>
              让留守的星光，与城市的灯火<br/>
              在故事里重逢
            </p>
            <div className="mt-5 flex items-center gap-2 text-stone-400">
              <span className="w-6 h-0.5 bg-stone-300 rounded-full" />
              <span className="doodle-text text-[10px] tracking-widest">守护每一份遥远的思念</span>
              <span className="w-6 h-0.5 bg-stone-300 rounded-full" />
            </div>
          </div>

          {/* 右页：涂鸦风入口按钮 */}
          <div className="book-page-right flex flex-col items-center justify-center px-10 py-12 gap-6">
            <button onClick={onEnterChild} className="doodle-btn doodle-wiggle">
              我是小朋友
            </button>
            <button onClick={onEnterParent} className="doodle-btn doodle-wiggle">
              我是爸爸妈妈
            </button>
          </div>

          {/* 逼真书脊折痕 */}
          <div className="book-spine-crease" />
        </div>
      </div>

      {/* 底部文案 */}
      <div className="absolute bottom-6 left-0 right-0 text-center" style={{ zIndex: 20 }}>
        <div className="text-white/25 text-xs tracking-wider" style={{ fontFamily: 'cursive' }}>咕咕教授 × AI · 守护每一份遥远的思念</div>
      </div>
    </div>
  );
}

/* ============== Demo Console ============== */
function DemoConsole({ role, setRole, appState }) {
  const [showModal, setShowModal] = React.useState(false);
  const [inputKey, setInputKey] = React.useState('');
  const [savedTip, setSavedTip] = React.useState(false);

  React.useEffect(() => {
    if (savedTip) {
      const t = setTimeout(() => setSavedTip(false), 2000);
      return () => clearTimeout(t);
    }
  }, [savedTip]);

  const openModal = () => {
    setInputKey(localStorage.getItem('DEEPSEEK_API_KEY') || '');
    setShowModal(true);
  };

  const saveKey = () => {
    if (inputKey.trim()) {
      localStorage.setItem('DEEPSEEK_API_KEY', inputKey.trim());
    } else {
      localStorage.removeItem('DEEPSEEK_API_KEY');
    }
    setSavedTip(true);
    setShowModal(false);
  };

  return (
    <>
      <div className="fixed top-0 left-0 right-0 z-50 bg-black/95 backdrop-blur text-white px-5 py-2.5 flex items-center justify-between border-b border-white/10">
        <div className="flex items-center gap-3">
          <div className="flex items-center gap-2">
            <div className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></div>
            <span className="text-xs font-mono tracking-wider opacity-80">DEMO CONSOLE</span>
          </div>
          <span className="text-[10px] font-mono opacity-40">|</span>

/* ============== 打字机 ============== */
function Typewriter({ text, speed = 55 }) {
  const [shown, setShown] = useState('');
  useEffect(() => {
    setShown('');
    if (!text) return;
    let i = 0;
    const timer = setInterval(() => {
      i++;
      setShown(text.slice(0, i));
      if (i >= text.length) clearInterval(timer);
    }, speed);
    return () => clearInterval(timer);
  }, [text]);
  return (<><span>{shown}</span>{shown.length < (text || '').length && <span className="typer-cursor"></span>}</>);
}

/* ============== 儿童画板 ============== */
const BRUSHES = [
  { id: 'mint', color: '#7BCFA9', name: '薄荷' },
  { id: 'butter', color: '#F5D86E', name: '奶油' },
  { id: 'peach', color: '#F4A988', name: '蜜桃' },
  { id: 'lilac', color: '#B49DDB', name: '紫莹' },
  { id: 'sky', color: '#7FB8E8', name: '天蓝' },
];
const ERASER = { id: 'eraser', color: '#fffdf7', name: '橡皮' };

function ChildDrawingCanvas({ onSubmit }) {
  const canvasRef = useRef(null);
  const ctxRef = useRef(null);
  const drawingRef = useRef(false);
  const lastPointRef = useRef(null);
  const [activeTool, setActiveTool] = useState(BRUSHES[0].id);
  const [hasContent, setHasContent] = useState(false);
  const hasContentRef = useRef(false);

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const dpr = window.devicePixelRatio || 1;
    const resize = () => {
      const rect = canvas.getBoundingClientRect();
      const targetWidth = Math.floor(rect.width * dpr);
      const targetHeight = Math.floor(rect.height * dpr);
      if (canvas.width !== targetWidth || canvas.height !== targetHeight) {
        const prev = canvas.toDataURL();
        canvas.width = targetWidth;
        canvas.height = targetHeight;
        canvas.style.width = rect.width + 'px';
        canvas.style.height = rect.height + 'px';
        const ctx = canvas.getContext('2d');
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctxRef.current = ctx;
        if (hasContentRef.current) {
          const img = new Image();
          img.onload = () => ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          img.src = prev;
        }
      }
    };
    resize();
    window.addEventListener('resize', resize);
    return () => window.removeEventListener('resize', resize);
  }, []);

  const getPoint = (e) => {
    const canvas = canvasRef.current;
    const rect = canvas.getBoundingClientRect();
    const touch = e.touches ? e.touches[0] : e;
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    return { x: (touch.clientX - rect.left) * scaleX, y: (touch.clientY - rect.top) * scaleY };
  };
  const startDraw = (e) => { e.preventDefault(); drawingRef.current = true; lastPointRef.current = getPoint(e); };
  const draw = (e) => {
    if (!drawingRef.current) return;
    e.preventDefault();
    const ctx = ctxRef.current; if (!ctx) return;
    const p = getPoint(e);
    const last = lastPointRef.current;
    const tool = activeTool === 'eraser' ? ERASER : BRUSHES.find(b => b.id === activeTool);
    const dpr = window.devicePixelRatio || 1;
    ctx.strokeStyle = tool.color;
    ctx.lineWidth = (activeTool === 'eraser' ? 28 : 12) * dpr;
    ctx.globalCompositeOperation = activeTool === 'eraser' ? 'destination-out' : 'source-over';
    ctx.beginPath();
    ctx.moveTo(last.x, last.y);
    ctx.quadraticCurveTo(last.x, last.y, (last.x + p.x)/2, (last.y + p.y)/2);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    lastPointRef.current = p;
    if (!hasContentRef.current) { hasContentRef.current = true; setHasContent(true); }
  };
  const endDraw = (e) => { if (e && e.preventDefault) e.preventDefault(); drawingRef.current = false; lastPointRef.current = null; };

  const handleSubmit = () => {
    if (!hasContent) return;
    onSubmit && onSubmit(canvasRef.current.toDataURL('image/png'));
  };
  const clearCanvas = () => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    if (!ctx) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    hasContentRef.current = false; setHasContent(false);
  };

  return (
    <div className="relative w-full h-full child-dream-bg flex flex-col overflow-hidden child-zone">
      {/* Top: IP Guide + Actions */}
      <div className="flex-none relative z-10 pt-20 px-4">
        <div className="flex items-start justify-between">
          <ProfessorOwlCorner message="今天画点什么给爸爸妈妈呀?" />
          <button onClick={clearCanvas} className="bg-white/70 backdrop-blur px-3 py-1.5 rounded-full text-xs text-stone-600 shadow-sm active:scale-95 transition mt-1">🗑 重画</button>
        </div>
      </div>

      {/* Middle: Magic Canvas */}
      <div className="flex-1 min-h-0 px-4 py-3 relative z-10">
        <div className="magic-canvas-container w-full h-full relative">
          <canvas ref={canvasRef} className="w-full h-full block paper-texture" onMouseDown={startDraw} onMouseMove={draw} onMouseUp={endDraw} onMouseLeave={endDraw} onTouchStart={startDraw} onTouchMove={draw} onTouchEnd={endDraw} />
          {!hasContent && <div className="absolute inset-0 flex items-center justify-center pointer-events-none"><div className="text-stone-400/80 text-xl font-bold tracking-wider select-none kid-font">在这里画画呀 ✏️</div></div>}
        </div>
      </div>

      {/* Bottom: Submit + Toolbar Dock */}
      <div className="flex-none relative z-10 pb-6 px-4 space-y-3">
        <div className="flex justify-end px-1">
          <button onClick={handleSubmit} disabled={!hasContent} className={`rounded-full px-6 py-4 text-white font-bold text-base flex items-center gap-2 transition-all duration-300 ${!hasContent ? 'bg-gray-400/60 opacity-50 grayscale cursor-not-allowed' : 'magic-btn-active cursor-pointer'}`}>
            <span className="text-xl">✨</span><span>画好了</span>
            {hasContent && <><span className="sparkle" style={{top:'4px', left:'10px'}}></span><span className="sparkle" style={{bottom:'6px', right:'14px', animationDelay:'0.5s'}}></span><span className="sparkle" style={{top:'12px', right:'30px', animationDelay:'1s'}}></span></>}
          </button>
        </div>
        <div className="glass-dock flex items-end justify-center gap-3 max-w-md mx-auto px-6 py-4">
          {BRUSHES.map(b => (
            <button key={b.id} onClick={() => setActiveTool(b.id)} className={`brush-tool ${activeTool === b.id ? 'active' : ''}`} aria-label={b.name}>
              <div className="flex flex-col items-center">
                <div className="w-0 h-0" style={{borderLeft:'14px solid transparent', borderRight:'14px solid transparent', borderBottom:`18px solid ${b.color}`, filter:'drop-shadow(0 2px 3px rgba(0,0,0,0.15))'}} />
                <div className="w-7 h-14 rounded-b-md shadow-md" style={{background:`linear-gradient(180deg, ${b.color} 0%, ${b.color}cc 100%)`, boxShadow:'inset -3px 0 4px rgba(0,0,0,0.15), 0 4px 6px rgba(0,0,0,0.1)'}} />
              </div>
            </button>
          ))}
          <button onClick={() => setActiveTool('eraser')} className={`brush-tool ml-2 ${activeTool === 'eraser' ? 'active' : ''}`} aria-label="橡皮">
            <div className="flex flex-col items-center">
              <div className="w-10 h-7 rounded-t-md bg-pink-300 shadow-md" style={{boxShadow:'inset -3px 0 4px rgba(0,0,0,0.15), 0 2px 4px rgba(0,0,0,0.15)'}} />
              <div className="w-10 h-7 rounded-b-md bg-blue-200" style={{boxShadow:'inset -3px 0 4px rgba(0,0,0,0.1)'}} />
            </div>
          </button>
        </div>
      </div>
    </div>
  );
}

const VOICE_PROMPTS = [
  "咕咕!我看到你的小主人公啦~他接下来要去干什么呀?",

  "这幅画里有好多颜色呀,哪一笔是你最喜欢的?为什么呢?",
];
const FALLBACK_TRANSCRIPT = "我画了一个怪兽,今天我很害怕";

/* ============== 儿童·语音诉说 ============== */
function ChildVoiceScene({ drawing, onSent }) {
  const [prompt] = useState(() => VOICE_PROMPTS[Math.floor(Math.random() * VOICE_PROMPTS.length)]);
  const [recording, setRecording] = useState(false);
  const [transcript, setTranscript] = useState('');
  const [interimText, setInterimText] = useState('');
  const [flying, setFlying] = useState(false);
  const [recognized, setRecognized] = useState(false);
  const [showTypeHint, setShowTypeHint] = useState(false);
  const phaseRef = useRef('idle');
  const pendingStopRef = useRef(false);
  const transcriptRef = useRef('');
  const recognitionRef = useRef(null);
  const mockTimerRef = useRef(null);
  const sentRef = useRef(false);
  const silenceTimerRef = useRef(null);

  useEffect(() => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return;
    try {
      const rec = new SR();
      rec.lang = 'zh-CN'; rec.continuous = true; rec.interimResults = true;
      rec.onresult = (e) => {
        const text = Array.from(e.results).map(r => r[0].transcript).join('');
        transcriptRef.current = text;
        setInterimText(text);
        if (silenceTimerRef.current) { clearTimeout(silenceTimerRef.current); silenceTimerRef.current = null; }
      };
      rec.onstart = () => {
        phaseRef.current = 'recording';
        if (pendingStopRef.current) { try { rec.stop(); } catch(e) {} }
      };
      rec.onend = () => {
        phaseRef.current = 'idle';
        setRecording(false);
        setInterimText('');
        if (silenceTimerRef.current) { clearTimeout(silenceTimerRef.current); silenceTimerRef.current = null; }
        if (pendingStopRef.current) { pendingStopRef.current = false; return; }
        const t = (transcriptRef.current || '').trim();
        if (sentRef.current) return;
        if (t) { setTranscript(prev => prev ? prev + ' ' + t : t); setRecognized(true); }
      };
      rec.onerror = () => {
        phaseRef.current = 'idle';
        pendingStopRef.current = false;
        setRecording(false);
        setInterimText('');
        if (silenceTimerRef.current) { clearTimeout(silenceTimerRef.current); silenceTimerRef.current = null; }
      };
      recognitionRef.current = rec;
    } catch (err) { recognitionRef.current = null; }
  }, []);
  useEffect(() => () => {
    if (mockTimerRef.current) clearTimeout(mockTimerRef.current);
    if (silenceTimerRef.current) clearTimeout(silenceTimerRef.current);
    if (recognitionRef.current) { try { recognitionRef.current.stop(); } catch(e) {} }
  }, []);

  const handleSend = () => {
    if (sentRef.current || !transcript.trim()) return;
    sentRef.current = true;
    setFlying(true);
    setTimeout(() => onSent && onSent(transcript), 2700);
  };

  const toggleMic = () => {
    if (sentRef.current || flying) return;

    if (phaseRef.current === 'idle') {
      // 开始录音
      phaseRef.current = 'requesting';
      transcriptRef.current = '';
      setInterimText('');
      setRecording(true);
      setShowTypeHint(false);
      if (silenceTimerRef.current) { clearTimeout(silenceTimerRef.current); silenceTimerRef.current = null; }
      if (recognitionRef.current) {
        try {
          recognitionRef.current.start();
          // 8秒静默超时：若未收到任何识别结果，自动停止并引导打字
          silenceTimerRef.current = setTimeout(() => {
            if (phaseRef.current !== 'idle') {
              try { recognitionRef.current.stop(); } catch(e) {}
              phaseRef.current = 'idle';
              setRecording(false);
              setInterimText('');
              setShowTypeHint(true);
            }
          }, 8000);
        } catch(err) { phaseRef.current = 'idle'; setRecording(false); }
      } else {
        mockTimerRef.current = setTimeout(() => {
          if (phaseRef.current !== 'idle' && !sentRef.current) {
            phaseRef.current = 'idle'; setRecording(false);
            const t = FALLBACK_TRANSCRIPT;
            setTranscript(prev => prev ? prev + ' ' + t : t);
            setRecognized(true);
          }
        }, 3000);
      }
    } else if (phaseRef.current === 'requesting' || phaseRef.current === 'recording') {
      // 停止录音
      if (phaseRef.current === 'requesting') { pendingStopRef.current = true; return; }
      phaseRef.current = 'idle';
      setRecording(false);
      setInterimText('');
      if (silenceTimerRef.current) { clearTimeout(silenceTimerRef.current); silenceTimerRef.current = null; }
      if (mockTimerRef.current) { clearTimeout(mockTimerRef.current); mockTimerRef.current = null; }
      if (recognitionRef.current) {
        try { recognitionRef.current.stop(); } catch(err) {}
      } else {
        const t = FALLBACK_TRANSCRIPT;
        setTranscript(prev => prev ? prev + ' ' + t : t);
        setRecognized(true);
      }
    }
  };

  return (
    <div className="relative w-full h-full child-dream-bg flex flex-col overflow-hidden child-zone">
      {/* Floating dream particles */}
      <div className="dream-particle w-3 h-3 top-[20%] left-[15%]" style={{animationDelay:'0s'}} />
      <div className="dream-particle w-2 h-2 top-[60%] left-[80%]" style={{animationDelay:'2s'}} />
      <div className="dream-particle w-4 h-4 top-[40%] left-[70%]" style={{animationDelay:'4s'}} />
      <div className="dream-particle w-2 h-2 top-[80%] left-[20%]" style={{animationDelay:'1s'}} />
      <div className="dream-particle w-3 h-3 top-[10%] left-[85%]" style={{animationDelay:'3s'}} />

      {/* Top: Drawing + Owl */}
      <div className="flex-none relative z-10 pt-20 px-4">
        <div className="flex items-start justify-between">
          <div className="flex flex-col items-start">
            <div className="thumb-card bg-white/90 backdrop-blur p-2 rounded-3xl shadow-[0_12px_40px_rgba(139,92,246,0.2)] -rotate-6 border border-white/60">
              {drawing ? <img src={drawing} className="w-24 h-28 object-cover rounded-xl paper-texture" alt="作品" /> : <div className="w-24 h-28 paper-texture rounded-xl" />}
            </div>
            <div className="text-[11px] text-indigo-700/70 mt-2 ml-2 bg-white/60 px-2 py-0.5 rounded-full">我的作品</div>
          </div>
          <div className="flex flex-col items-center mt-2">
            <div className="relative">
              <div className="absolute inset-0 bg-purple-400/30 blur-2xl rounded-full scale-150 pointer-events-none" />
              <div className="text-[8rem] leading-none owl-float drop-shadow-[0_12px_40px_rgba(139,92,246,0.5)] relative z-10">🦉</div>
              <span className="absolute -top-3 -right-2 text-amber-700 owl-zzz font-bold text-xl z-10">z</span>
              <span className="absolute -top-8 right-4 text-amber-700 owl-zzz font-bold text-lg z-10" style={{animationDelay:'0.6s'}}>z</span>
              <span className="absolute -top-14 right-9 text-amber-700 owl-zzz font-bold text-base z-10" style={{animationDelay:'1.2s'}}>z</span>
            </div>
            <div className="text-sm text-amber-800/70 mt-2 italic yawn-bubble bg-white/60 px-3 py-1 rounded-full font-bold">~哈欠~</div>
            <div className="text-sm text-indigo-600 mt-1 font-bold">咕咕教授</div>
          </div>
        </div>
      </div>

      {/* Middle: Prompt bubble */}
      <div className="flex-1 min-h-0 relative z-10 flex items-center justify-center px-6">
        <div className="relative bg-white/70 backdrop-blur-xl rounded-[2rem] shadow-[0_12px_40px_rgba(139,92,246,0.15)] px-7 py-5 max-w-md text-center text-stone-700 text-base leading-relaxed border border-white/50">
          <div className="absolute -top-3 right-10 w-4 h-4 bg-white/70 rotate-45 border-l border-t border-white/50"></div>
          {showTypeHint ? (
            <div className="animate-pulse">
              <span className="text-2xl mr-2">🦉</span>
              <span className="text-indigo-700 font-medium">咕咕好像没听清哦，要不要试试用键盘直接打字告诉咕咕？</span>

  const phaseRef = useRef('idle');
  const pendingStopRef = useRef(false);
  const transcriptRef = useRef('');
  const recognitionRef = useRef(null);

  useEffect(() => {
    let cancelled = false;
    setAiLoading(true);
    analyzeDoodleWithAI(transcript).then(result => {
      if (!cancelled) { setAnalysis(result); setAiLoading(false); }
    });
    return () => { cancelled = true; };
  }, [transcript]);

  useEffect(() => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return;
    try {
      const rec = new SR();
      rec.lang = 'zh-CN'; rec.continuous = true; rec.interimResults = true;
      rec.onresult = (e) => { const text = Array.from(e.results).map(r => r[0].transcript).join(''); transcriptRef.current = text; setInterimText(text); };
      rec.onstart = () => {
        phaseRef.current = 'recording';
        if (pendingStopRef.current) { try { rec.stop(); } catch(e) {} }
      };
      rec.onend = () => {
        phaseRef.current = 'idle';
        setRecording(false);
        setInterimText('');
        if (pendingStopRef.current) { pendingStopRef.current = false; return; }
        const t = (transcriptRef.current || '').trim();
        if (t) { setParentText(prev => prev ? prev + ' ' + t : t); }
      };
      rec.onerror = () => {
        phaseRef.current = 'idle';
        pendingStopRef.current = false;
        setRecording(false);
        setInterimText('');
      };
      recognitionRef.current = rec;
    } catch (err) { recognitionRef.current = null; }
  }, []);

  const handleAdopt = () => { setLoading(true); setTimeout(() => onBookReady && onBookReady({ childTranscript: transcript, parentText: parentText || '' }), 2000); };

  const toggleVoice = () => {
    if (phaseRef.current === 'idle') {
      phaseRef.current = 'requesting';
      transcriptRef.current = '';
      setInterimText('');
      setRecording(true);
      if (recognitionRef.current) {
        try { recognitionRef.current.start(); } catch(err) { phaseRef.current = 'idle'; setRecording(false); }
      }
    } else if (phaseRef.current === 'requesting' || phaseRef.current === 'recording') {
      if (phaseRef.current === 'requesting') { pendingStopRef.current = true; return; }
      phaseRef.current = 'idle';
      setRecording(false);
      setInterimText('');
      if (recognitionRef.current) { try { recognitionRef.current.stop(); } catch(err) {} }
    }

              {aiLoading ? (
                <span className="ml-auto text-[10px] font-medium text-blue-600 bg-blue-50 px-2 py-0.5 rounded-full animate-pulse">分析中...</span>
              ) : analysis?.aiGenerated ? (

              ) : null}
            </div>

/* ============== 魔法绘本阅读器 ============== */
function BookReader({ transcript, parentText }) {
  const safeTranscript = transcript || "我画了一个怪兽,今天我很害怕";
  const safeParentText = parentText || '';
  const [pages] = useState(() => {
    const analysis = simulateAnalysis(safeTranscript);
    return generateBookPages(safeTranscript, safeParentText, analysis);
  });
  const [currentPage, setCurrentPage] = useState(0);
  const [imageLoaded, setImageLoaded] = useState(false);
  const [imageError, setImageError] = useState(false);
  const [speaking, setSpeaking] = useState(false);

  const page = pages[currentPage];
  const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(page.imagePrompt)}?nologo=true`;

  useEffect(() => {
    setImageLoaded(false);
    setImageError(false);
    setSpeaking(false);
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    if (currentPage < pages.length - 1) {
      const img = new Image();
      img.src = `https://image.pollinations.ai/prompt/${encodeURIComponent(pages[currentPage + 1].imagePrompt)}?nologo=true`;
    }
  }, [currentPage, pages]);

  const speak = () => {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(page.text);
    u.lang = 'zh-CN';
    u.pitch = 1.15;
    u.rate = 0.85;
    u.onstart = () => setSpeaking(true);
    u.onend = () => setSpeaking(false);
    u.onerror = () => setSpeaking(false);
    window.speechSynthesis.speak(u);
  };

  useEffect(() => {
    const onKey = (e) => {
      if (e.key === 'ArrowRight') setCurrentPage(p => Math.min(p + 1, pages.length - 1));
      if (e.key === 'ArrowLeft') setCurrentPage(p => Math.max(p - 1, 0));
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [pages.length]);

  return (
    <div className="w-full h-full flex flex-col bg-[#FDF8F0] pt-12 select-none">
      {/* 顶部装饰书名 */}
      <div className="shrink-0 pt-6 pb-2 text-center">
        <div className="text-[10px] text-stone-400 font-medium tracking-[0.3em] uppercase">Cloud Lullaby</div>
        <div className="text-xs text-stone-300 mt-1 tracking-widest">云端枕边书 · 魔法绘本</div>
      </div>

      <div className="flex-1 flex items-center justify-center p-4 md:p-8 lg:p-10">
        <div className="w-full max-w-6xl h-full max-h-[860px] flex flex-col md:flex-row bg-white rounded-[2rem] shadow-[0_20px_60px_rgba(0,0,0,0.07)] overflow-hidden border border-stone-100">

          {/* 左：插图页 */}
          <div className="flex-1 relative bg-[#FAFAF8] flex items-center justify-center p-5 md:p-8 lg:p-10">
            {/* 画框效果 */}
            <div className="relative w-full h-full flex items-center justify-center">
              {!imageLoaded && !imageError && (
                <div className="absolute inset-0 flex flex-col items-center justify-center z-10">
                  <div className="w-16 h-16 border-[3px] border-stone-200 border-t-stone-400 rounded-full animate-spin mb-4" />
                  <div className="text-sm font-medium text-stone-500">咕咕教授正在作画...</div>
                  <div className="text-xs text-stone-400 mt-1">AI 渲染中，请稍候</div>
                </div>
              )}
              {imageError && (
                <div className="absolute inset-0 flex flex-col items-center justify-center z-10">
                  <div className="text-5xl mb-3">🖼️</div>
                  <div className="text-sm text-stone-500">网络有点调皮</div>
                  <div className="text-xs text-stone-400 mt-1">但故事依旧温暖</div>
                </div>
              )}
              <img
                src={imageUrl}
                alt="绘本插图"
                className={`max-w-full max-h-full object-contain rounded-xl shadow-[0_4px_20px_rgba(0,0,0,0.06)] transition-all duration-700 ${imageLoaded ? 'opacity-100 scale-100' : 'opacity-0 scale-95'}`}
                onLoad={() => setImageLoaded(true)}
                onError={() => setImageError(true)}
              />
            </div>
          </div>

          {/* 书脊分割线 */}
          <div className="hidden md:block w-px bg-stone-100 self-stretch my-8" />

          {/* 右：文字页 */}
          <div className="flex-1 flex flex-col justify-center p-6 md:p-10 lg:p-14 relative">
            {/* 页码 */}
            <div className="absolute top-6 right-8 md:top-8 md:right-10 flex items-center gap-2">
              <span className="text-[10px] text-stone-300 font-mono tracking-wider">{String(currentPage + 1).padStart(2, '0')} / {String(pages.length).padStart(2, '0')}</span>
            </div>

            {/* 章节装饰线 */}
            <div className="flex items-center gap-3 mb-8">
              <div className="h-px flex-1 bg-stone-100" />
              <span className="text-[10px] text-stone-300 tracking-[0.2em]">CHAPTER</span>
              <div className="h-px flex-1 bg-stone-100" />
            </div>

            {/* 正文 */}
            <div className={`text-base md:text-lg lg:text-xl leading-[2.2] text-stone-700 font-medium tracking-wide ${imageLoaded ? 'page-content' : ''}`}>
              {page.text}
            </div>

            {/* 章节装饰线底部 */}
            <div className="flex items-center gap-3 mt-8">
              <div className="h-px flex-1 bg-stone-100" />
              <span className="text-stone-300 text-xs">❦</span>
              <div className="h-px flex-1 bg-stone-100" />
            </div>

            {/* 伴读按钮 */}
            <div className="mt-8 flex items-center justify-between">
              {typeof window !== 'undefined' && window.speechSynthesis && (
                <button
                  onClick={speak}
                  disabled={speaking}
                  className={`group flex items-center gap-2.5 px-6 py-3 rounded-full text-sm font-semibold transition-all shadow-sm ${speaking ? 'bg-rose-500 text-white shadow-rose-200' : 'bg-stone-100 hover:bg-stone-200 text-stone-700'}`}
                >
                  <span className={`text-base transition-transform ${speaking ? 'animate-pulse' : 'group-hover:scale-110'}`}>{speaking ? '🔊' : '▶️'}</span>
                  <span>{speaking ? '正在伴读...' : '播放妈妈/爸爸伴读'}</span>
                </button>
              )}
              <span className="text-[10px] text-stone-300 tracking-wider hidden md:block">by 咕咕教授 × AI</span>
            </div>
          </div>
        </div>
      </div>

      {/* 底部导航 */}
      <div className="shrink-0 pb-6 md:pb-8 flex justify-center">
        <div className="flex items-center gap-5 bg-white rounded-2xl px-6 md:px-8 py-3.5 shadow-[0_4px_20px_rgba(0,0,0,0.05)] border border-stone-100">
          <button
            disabled={currentPage === 0}
            onClick={() => setCurrentPage(p => p - 1)}
            className="flex items-center gap-1 px-4 py-2.5 bg-stone-50 hover:bg-stone-100 rounded-xl text-sm font-medium text-stone-700 disabled:opacity-30 disabled:cursor-not-allowed transition active:scale-95"
          >
            <span>←</span> 上一页
          </button>

          <div className="flex gap-2 px-2">
            {pages.map((_, i) => (
              <button
                key={i}
                onClick={() => setCurrentPage(i)}
                className={`w-2.5 h-2.5 rounded-full transition-all duration-300 ${i === currentPage ? 'bg-stone-800 w-6' : 'bg-stone-200 hover:bg-stone-300'}`}
                aria-label={`第 ${i + 1} 页`}
              />
            ))}
          </div>

          <button
            disabled={currentPage === pages.length - 1}
            onClick={() => setCurrentPage(p => p + 1)}
            className="flex items-center gap-1 px-4 py-2.5 bg-stone-50 hover:bg-stone-100 rounded-xl text-sm font-medium text-stone-700 disabled:opacity-30 disabled:cursor-not-allowed transition active:scale-95"
          >
            下一页 <span>→</span>
          </button>
        </div>
      </div>
    </div>
  );
}

/* ============== 父母·等待 ============== */
function ParentWaiting() {
  return (
    <div className="mobile-mockup">
      <div className="mobile-screen flex flex-col items-center justify-center text-center p-6">
        <div className="text-5xl mb-3">📭</div>
        <h3 className="text-base font-bold text-stone-700 mb-1">信箱空空</h3>
        <p className="text-xs text-stone-400">等孩子的第一封信来...</p>
      </div>
    </div>
  );
}

/* ============== 主应用 ============== */
function App() {
  const [role, setRole] = useState(ROLES.CHILD);
  const [appState, setAppState] = useState(APP_STATES.LANDING);
  const [drawingData, setDrawingData] = useState(null);
  const [voiceData, setVoiceData] = useState(null);
  const [parentTextData, setParentTextData] = useState('');

  const handleDrawingSubmit = (dataUrl) => { setDrawingData(dataUrl); setAppState(APP_STATES.CHILD_VOICE); };
  const handleVoiceSent = (text) => { setVoiceData(text); setAppState(APP_STATES.CHILD_WAITING); };

  useEffect(() => {
    setAppState(prev => {
      // LANDING / CHILD_TUTORIAL 是引导态，不能被自动路由覆盖
      if (prev === APP_STATES.LANDING || prev === APP_STATES.CHILD_TUTORIAL) return prev;
      if (role === ROLES.PARENT) {
        return prev === APP_STATES.BOOK_READY ? prev : (drawingData ? APP_STATES.PARENT_REVIEW : APP_STATES.WAITING_PARENT);
      } else {
        if (!drawingData) return APP_STATES.CHILD_DRAWING;
        if (!voiceData) return APP_STATES.CHILD_VOICE;
        return APP_STATES.CHILD_WAITING;
      }
    });
  }, [role, drawingData, voiceData]);

  const renderChild = () => {
    if (appState === APP_STATES.CHILD_TUTORIAL) return <ChildTutorial onReady={() => setAppState(APP_STATES.CHILD_DRAWING)} />;
    if (appState === APP_STATES.CHILD_DRAWING) return <ChildDrawingCanvas onSubmit={handleDrawingSubmit} />;
    if (appState === APP_STATES.CHILD_VOICE) return <ChildVoiceScene drawing={drawingData} onSent={handleVoiceSent} />;
    return <ChildWaiting drawing={drawingData} transcript={voiceData} />;
  };

  if (appState === APP_STATES.LANDING) {
    return (
      <div className="w-full h-full relative">
        <DemoConsole role={role} setRole={setRole} appState={appState} />
        <LandingPage
          onEnterChild={() => { setRole(ROLES.CHILD); setAppState(APP_STATES.CHILD_TUTORIAL); }}
          onEnterParent={() => { setRole(ROLES.PARENT); setAppState(APP_STATES.WAITING_PARENT); }}
        />
      </div>
    );
  }

  if (appState === APP_STATES.BOOK_READY) {
    return (
      <div className="w-full h-full relative">
        <DemoConsole role={role} setRole={setRole} appState={appState} />
        <BookReader transcript={voiceData} parentText={parentTextData} />
      </div>
    );
  }

  return (
    <div className="w-full h-full relative">
      <DemoConsole role={role} setRole={setRole} appState={appState} />
      <div className="w-full h-full">
        {role === ROLES.CHILD ? renderChild() : (
          <div className="w-full h-full flex items-center justify-center bg-gradient-to-br from-slate-200 via-slate-100 to-stone-200 pt-16 pb-8 px-4">
            {appState === APP_STATES.PARENT_REVIEW ? (
              <ParentReview drawing={drawingData} transcript={voiceData} onBookReady={({ childTranscript, parentText }) => { setVoiceData(childTranscript); setParentTextData(parentText); setAppState(APP_STATES.BOOK_READY); }} />
            ) : (
              <ParentWaiting />
            )}
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
